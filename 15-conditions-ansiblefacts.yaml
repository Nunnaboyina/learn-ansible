- name: print os is RedHat or not
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: print the os
    debug:
      msg: " Os distro is RedHat"
    when: ansible_facts.os_family == "RedHat"  

  - name: print the os
    debug:
      msg: " Os distro is Ubuntu"
    when: ansible_facts.os_family == "Debian" 
  # Install nginx
  - name: install nginx in RedHat
    dnf:
      name: nginx
      state: present
    when: ansible_facts.os_family == "RedHat"  
  - name: install nginx in Ubuntu
    apt:
      name: nginx
      state: present
    when: ansible_facts.os_family == "Debian"  