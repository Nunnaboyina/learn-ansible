- name: default function
  hosts: local
  connection: local
  vars:
    print_name: "Mohan"
    topics: "Linux, shell, Ansible, Terraform, Docker"
    names:
    - Mohan
    - Krishna
    - Geddada
    upperc: ansible
    lowerc: DEVSECOPS
    capital: "mohan geddada"
  tasks:
  - name: print name
    debug:
      msg: "Hi, {{ print_name | default('Ramesh') }}"
  - name: convert string to list
    debug:
      msg: "Topics are: {{ topics | split(' ,') | trim }}"
  - name: convert list to string
    debug:
      msg: "{{ names | join(' ') }}"
  - name: upper case
    debug:
      msg: "{{ upperc | upper }}"
  - name: lower case
    debug:
      msg: "{{ lowerc | lower }}"
  - name: capitalize
    debug:
      msg: "{{ capital | capitalize }}"
