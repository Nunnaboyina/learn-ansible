- name: datatypes
  hosts: local
  connection: local
  vars:
    my_string: "Siva Kumar" #string
    my_int: 40 # int
    my_list: #list
     - address: 28373 
     - city: frisco
     - state: TX
    my_map: # dict
      port: 2020
      proto: http
    my_bool: true #bool
    my_float: 4.5

  tasks:
  - name: priting datatypes
    debug:
      msg: |
        "{{my_string}} is {{my_string | type_debug}}"
        "{{my_int}} is {{my_int | type_debug}}"
        "{{my_list}} is {{my_list | type_debug}}"
        "{{my_map}} is {{my_map | type_debug}}"
        "{{my_bool}} is {{my_bool | type_debug}}"
        "{{my_float}} is {{my_float | type_debug}}"

