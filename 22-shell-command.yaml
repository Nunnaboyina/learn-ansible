- name: shell vs command
  hosts: local
  connection: local
  tasks:
  - name: getting user information
    #command: cat /etc/passwd | grep ec2-user
    shell: cat /etc/passwd | grep ec2-user
    register: ec2_user_output
  
  - name: printing user information
    debug:
      msg: "{{ ec2_user_output }}"
  
  - name: testing redirection
    #command: ls -la > /tmp/files.txt
    shell: ls -la > /tmp/files.txt
    register: shell_output

  - name: printing files info
    debug:
      msg: "{{ shell_output }}"
